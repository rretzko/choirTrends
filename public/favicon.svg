<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg3b" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#006D77"/>
            <stop offset="100%" style="stop-color:#83C5BE"/>
        </linearGradient>
    </defs>
    <circle cx="256" cy="256" r="240" fill="url(#bg3b)"/>
    <!-- Curved staff lines along bottom arc -->
    <path d="M80 340 Q256 420 432 340" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
    <path d="M65 365 Q256 445 447 365" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
    <path d="M55 390 Q256 470 457 390" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
    <path d="M55 415 Q256 495 457 415" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
    <path d="M70 438 Q256 515 442 438" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
    <!-- CT Text -->
    <text x="256" y="230" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="230" fill="white" text-anchor="middle" dominant-baseline="central" letter-spacing="-10">CT</text>
    <!-- Small note on staff -->
    <ellipse cx="200" cy="388" rx="16" ry="11" fill="rgba(255,255,255,0.6)" transform="rotate(-20, 200, 388)"/>
    <line x1="214" y1="382" x2="214" y2="330" stroke="rgba(255,255,255,0.6)" stroke-width="3.5"/>
    <!-- Another note -->
