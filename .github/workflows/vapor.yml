name: Deploy to Vapor

on:
  push:
    branches:
      - dev        # Deploy to staging
      - master     # Deploy to production
      - main       # Deploy to production (if using main instead of master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, bcmath
          coverage: none

      - name: Configure Flux Pro authentication
        run: |
          composer config --global --auth http-basic.composer.fluxui.dev \
            ${{ secrets.FLUX_PRO_USERNAME }} ${{ secrets.FLUX_PRO_PASSWORD }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Vapor CLI
        run: composer global require laravel/vapor-cli

      - name: Deploy to Vapor Staging
        if: github.ref == 'refs/heads/dev'
        env:
          VAPOR_API_TOKEN: ${{ secrets.VAPOR_CHOIRTRENDS_TOKEN }}
        run: vapor deploy staging

      - name: Deploy to Vapor Production
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          VAPOR_API_TOKEN: ${{ secrets.VAPOR_CHOIRTRENDS_TOKEN }}
        run: vapor deploy production
